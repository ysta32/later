name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w apps/web
      - name: Site check
        run: node apps/site/scripts/check.mjs
      - name: Server boot smoke test
        run: |
          export LATER_DATA_DIR="$(mktemp -d)"
          PORT=4800 node apps/server/src/index.ts &
          pid=$!
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4800/api/health; then ok=1; break; fi
            sleep 1
          done
          kill "$pid" || true
          [ "$ok" = 1 ]

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
